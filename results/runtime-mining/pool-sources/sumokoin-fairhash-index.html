<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 24px;
    }
    h1 {
      font-size: 96px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin: 8px 0;
      font-size: 28px;
    }
    p {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you are looking for does not exist.</p>
    <a href="/">Go back home</a>
  </main>
</body>
</html>
