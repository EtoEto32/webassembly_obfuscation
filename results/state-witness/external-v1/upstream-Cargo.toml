[package]
name = "wasm-migrate-probe"
version = "0.0.0"
edition = "2021"
[dependencies]
wasm-migrate = { path = "crates/wasm-migrate" }
[workspace]
members = ["crates/wasm-migrate", "crates/wasm-mutate", "crates/wasmparser", "crates/wasm-encoder", "crates/wasmprinter", "crates/wat", "crates/wast"]
resolver = "2"
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The default set of lints in Clippy is viewed as "too noisy" right now so
# they're all turned off by default. Selective lints are then enabled below as
# necessary.
all = { level = 'allow', priority = -1 }
clone_on_copy = 'warn'
map_clone = 'warn'
unnecessary_to_owned = 'warn'
manual_strip = 'warn'

[workspace.package]
edition = '2021'
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
version = "0.222.0"
# Current policy for wasm-tools is the same as Wasmtime which is that this
# number can be no larger than the current stable release of Rust minus 2.
#
# NB: if this number increases to 1.81-or-later delete
# `crates/wasmparser/build.rs` and `crates/wasm-encoder/build.rs` scripts
# as they are no longer necessary.
rust-version = "1.76.0"

[workspace.dependencies]
anyhow = "1.0.58"
arbitrary = "1.1.0"
clap = { version = "4.0.0", features = ["derive"] }
clap_complete = "4.4.7"
comfy-table = { version = "7.1.3", default-features = false }
criterion = { version = "0.5.1", default-features = false }
env_logger = "0.11"
indexmap = { version = "2.7.0", default-features = false }
leb128 = "0.2.4"
libfuzzer-sys = "0.4.0"
log = "0.4.17"
num_cpus = "1.13"
rand = { version = "0.8.4", features = ["small_rng"] }
rayon = "1.3"
serde = { version = "1.0.166", default-features = false, features = ['alloc'] }
serde_derive = "1.0.166"
serde_json = { version = "1" }
spdx = "0.10.1"
wasmtime = { version = "25.0.0", default-features = false, features = ['cranelift', 'component-model', 'runtime', 'gc'] }
url = "2.0.0"
pretty_assertions = "1.3.0"
semver = { version = "1.0.0", default-features = false }
smallvec = "1.11.1"
libtest-mimic = "0.7.0"
bitflags = "2.5.0"
hashbrown = { version = "0.15.2", default-features = false, features = ['default-hasher'] }
ahash = { version = "0.8.11", default-features = false }
termcolor = "1.2.0"
indoc = "2.0.5"
gimli = "0.30.0"
id-arena = "2"

wasm-migrate = { version = "0.222.0", path = "crates/wasm-migrate"}
wasm-compose = { version = "0.222.0", path = "crates/wasm-compose" }
wasm-encoder = { version = "0.222.0", path = "crates/wasm-encoder", default-features = false, features = ["std"] }
wasm-metadata = { version = "0.222.0", path = "crates/wasm-metadata" }
wasm-mutate = { version = "0.222.0", path = "crates/wasm-mutate" }
wasm-shrink = { version = "0.222.0", path = "crates/wasm-shrink" }
wasm-smith = { version = "0.222.0", path = "crates/wasm-smith" }
wasmparser = { version = "0.222.0", path = "crates/wasmparser", default-features = false, features = ['std', 'simd'] }
wasmprinter = { version = "0.222.0", path = "crates/wasmprinter", default-features = false }
wast = { version = "222.0.0", path = "crates/wast", default-features = false }
wat = { version = "1.222.0", path = "crates/wat", default-features = false }
wit-component = { version = "0.222.0", path = "crates/wit-component" }
wit-encoder = { version = "0.222.0", path = "crates/wit-encoder" }
wit-parser = { version = "0.222.0", path = "crates/wit-parser" }
wit-smith = { version = "0.222.0", path = "crates/wit-smith" }
